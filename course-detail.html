<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start Learning — LearnAI</title><link rel="stylesheet" href="css/style.css"><style>
body{background:#f5f7fb}.learn-wrap{max-width:1100px;margin:auto;padding:42px 24px 70px}.back{display:inline-block;margin-bottom:18px;color:#1769d3;text-decoration:none;font-weight:700}.hero{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:28px;box-shadow:0 5px 18px rgba(22,41,65,.05)}.kicker{color:#1769d3;font-size:12px;font-weight:800;letter-spacing:1.5px}.hero h1{color:#13243d;margin:8px 0}.hero p{color:#65758c;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.panel{background:#fff;border:1px solid #e0e6ef;border-radius:16px;padding:22px}.panel h2{margin:0 0 10px;color:#203550;font-size:19px}.wiki-box{line-height:1.7;color:#617187}.source{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f4}.source:last-child{border:0}.source a{color:#1769d3;font-weight:700;text-decoration:none}.video{border:1px solid #e2e7ee;border-radius:10px;padding:14px;margin-top:10px}.video a{color:#1769d3;font-weight:700;text-decoration:none}.lesson{padding:12px 0;border-bottom:1px solid #edf0f4}.lesson b{color:#273b55}.muted{color:#7a899c;font-size:13px}.loading{color:#7a899c}.full{grid-column:1/-1}.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.btnx{padding:11px 16px;border-radius:9px;border:1px solid #d5e0ed;background:#fff;color:#1769d3;font-weight:750;text-decoration:none}.btnx.primary{background:#1769d3;color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="site-header" data-site-header></header><main class="learn-wrap"><a class="back" href="courses.html">← Back to Learning Hub</a><section class="hero"><span class="kicker">NOW LEARNING</span><h1 id="title">Loading topic…</h1><p id="desc"></p><div class="actions"><a id="wikiLink" class="btnx" target="_blank" rel="noopener">📖 Open Wikipedia</a><a id="ytLink" class="btnx primary" target="_blank" rel="noopener">🎥 Find learning videos</a></div></section><div class="grid"><section class="panel"><h2>📖 Topic Reference</h2><div id="wiki" class="wiki-box"><span class="loading">Finding a Wikipedia summary…</span></div></section><section class="panel"><h2>🎥 Related Learning Videos</h2><p class="muted">Video search is generated from your selected topic.</p><div id="videos"><span class="loading">Preparing video suggestions…</span></div></section><section class="panel full"><h2>📚 Course Lessons</h2><div id="lessons"></div></section></div></main><footer class="site-footer" data-site-footer></footer><script src="js/app.js"></script><script>
const id=localStorage.getItem('learnAI_selectedCourse'); const course=(window.learningCourses||[]).find(x=>x.id===id); // fallback data loaded below
const courses=[{id:'statistics',title:'Statistical Data Literacy',description:'Build a strong foundation in understanding, interpreting and communicating statistical data.',topics:[['Introduction to Statistical Data','Understand datasets, variables, observations and common statistical terminology.'],['Measures of Central Tendency','Learn mean, median and mode and understand when each measure is useful.'],['Measures of Dispersion','Understand range, variance and standard deviation.'],['Reading Statistical Tables','Interpret rows, columns, percentages and statistical indicators.'],['Data Interpretation','Turn statistical results into meaningful conclusions.'],['Communicating Statistical Evidence','Present statistical findings clearly for professional audiences.']]},{id:'sampling',title:'Survey Sampling & Estimation',description:'Understand sampling methods, sample design, sampling error and estimation.',topics:[['Population and Sample','Understand target populations, survey populations and samples.'],['Sampling Methods','Learn probability and non-probability sampling approaches.'],['Sampling Error','Understand why sample estimates differ from population parameters.']]},{id:'digital',title:'Digital Fluency for Professionals',description:'Develop practical digital skills needed for efficient modern professional work.',topics:[['Digital Workplace','Understand modern digital workplace concepts.'],['Information Management','Organize and manage digital information effectively.'],['Online Collaboration','Use digital collaboration practices effectively.']]},{id:'leadership',title:'Leadership & Decision Making',description:'Strengthen leadership thinking, decision-making and professional communication.',topics:[['Leadership Fundamentals','Understand core principles of effective leadership.'],['Decision Making','Develop structured approaches to professional decisions.'],['Problem Solving','Break complex problems into manageable parts.'],['Team Communication','Communicate goals, feedback and expectations clearly.']]},{id:'official-statistics',title:'Introduction to Official Statistics',description:'Understand the role, production process and importance of official statistics.',topics:[['What are Official Statistics?','Understand the purpose and role of official statistical information.'],['Statistical Production','Explore major stages involved in producing statistical outputs.'],['Data Sources','Understand surveys, administrative data and other sources.']]},{id:'analytics',title:'Advanced Data Analytics',description:'Strengthen analytical thinking for complex datasets and evidence-based insights.',topics:[['Advanced Exploratory Analysis','Develop structured approaches to investigating complex datasets.'],['Relationships Between Variables','Explore relationships and associations between variables.'],['Trend Analysis','Identify and communicate meaningful trends.']]}];
const c=courses.find(x=>x.id===id)||courses[0]; const topic=c.title; document.getElementById('title').textContent=topic; document.getElementById('desc').textContent=c.description; const q=encodeURIComponent(topic); document.getElementById('wikiLink').href='https://en.wikipedia.org/wiki/Special:Search?search='+q; document.getElementById('ytLink').href='https://www.youtube.com/results?search_query='+encodeURIComponent(topic+' tutorial lecture'); document.getElementById('lessons').innerHTML=c.topics.map((t,i)=>`<div class="lesson"><b>${i+1}. ${t[0]}</b><div class="muted">${t[1]}</div></div>`).join('');
async function loadWiki(){const box=document.getElementById('wiki'); try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(topic.replace(/ /g,'_'))); if(!r.ok)throw 0; const d=await r.json(); box.innerHTML=`<b>${d.title||topic}</b><p>${d.extract||'No summary available.'}</p>${d.content_urls?.desktop?.page?`<a target="_blank" rel="noopener" href="${d.content_urls.desktop.page}">Read full Wikipedia article →</a>`:''}`;}catch(e){box.innerHTML=`<p>Wikipedia summary could not be loaded automatically.</p><a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/Special:Search?search=${q}">Search Wikipedia for this topic →</a>`}}
function videos(){const terms=[topic+' explained',topic+' for beginners',topic+' lecture']; document.getElementById('videos').innerHTML=terms.map(x=>`<div class="video"><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x)}">▶ ${x}</a><div class="muted">Open YouTube search for relevant educational videos.</div></div>`).join('')}
loadWiki();videos();
</script></body></html>
