<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub — LearnAI</title><link rel="stylesheet" href="css/style.css">
<style>
.learning-page{background:#f5f7fb;min-height:100vh}.dashboard-main{max-width:1390px;margin:auto;padding:48px 32px 70px}.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:30px}.section-kicker{display:inline-block;color:#1769d3;font-size:13px;font-weight:800;letter-spacing:1.7px;margin-bottom:12px}.dash-head h1{margin:0;color:#13243d;font-size:44px;line-height:1.12}.dash-head p{margin:13px 0 0;color:#65758c;font-size:17px;line-height:1.6}.learning-add-btn{flex-shrink:0}.learning-toolbar{display:grid;grid-template-columns:1fr 220px 120px;gap:12px;margin-bottom:38px}.learning-toolbar .search,.learning-toolbar select,.learning-toolbar .filter-btn{height:50px;background:#fff;border:1px solid #dce3ed;border-radius:11px}.learning-toolbar .search{display:flex;align-items:center;padding:0 16px;color:#7a899d}.learning-toolbar .search input{flex:1;height:48px;border:0;outline:0;background:transparent;padding:0 12px;font-size:14px}.learning-toolbar select{padding:0 14px;color:#53647a;font-size:14px;outline:0}.learning-toolbar .filter-btn{color:#3f5067;font-weight:650;cursor:pointer;font-size:14px}.courses-heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.courses-heading h2{margin:0;color:#172941;font-size:23px}.courses-heading p{margin:5px 0 0;color:#7a889a;font-size:13px}.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.learn-course-card{background:#fff;border:1px solid #e0e6ef;border-radius:17px;overflow:hidden;display:flex;flex-direction:column;min-height:395px;box-shadow:0 5px 18px rgba(22,41,65,.04);transition:.2s}.learn-course-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(22,41,65,.1)}.course-top{display:flex;justify-content:space-between;padding:20px 20px 8px}.course-icon,.modal-icon{width:49px;height:49px;border-radius:12px;background:#eaf3ff;color:#1769d3;display:flex;align-items:center;justify-content:center;font-size:24px}.course-level{padding:6px 10px;border-radius:20px;font-size:10px;font-weight:800}.level-beginner{background:#e9f8f0;color:#21834c}.level-intermediate{background:#fff4df;color:#a76a00}.level-advanced{background:#f2e9ff;color:#7440a7}.course-body{padding:12px 20px 18px;flex:1}.course-category{display:inline-block;color:#1769d3;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.course-body h3{margin:0;color:#162941;font-size:19px;line-height:1.3}.course-description{margin:9px 0 0;color:#6d7c90;font-size:13px;line-height:1.65}.course-meta{display:flex;flex-wrap:wrap;gap:15px;margin-top:17px;padding-top:14px;border-top:1px solid #edf0f4}.course-meta span{color:#65758a;font-size:12px}.course-skills,.modal-skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.course-skills span{padding:5px 8px;border-radius:6px;background:#f2f5f9;color:#56677e;font-size:10px;font-weight:650}.course-footer{padding:0 20px 20px}.course-btn{width:100%;height:43px;border:1px solid #d5e0ed;border-radius:9px;background:#fff;color:#1769d3;font-size:13px;font-weight:750;cursor:pointer}.course-btn:hover{background:#1769d3;color:#fff}.no-courses{grid-column:1/-1;min-height:270px;background:#fff;border:1px dashed #cbd6e3;border-radius:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:35px}.no-courses-icon{font-size:25px;margin-bottom:14px}.no-courses h3{margin:0;color:#172941}.no-courses p{color:#718096;font-size:14px}.no-courses button{border:0;background:#1769d3;color:#fff;padding:10px 17px;border-radius:8px;font-weight:700;cursor:pointer}.course-modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(9,22,40,.6);display:none;align-items:center;justify-content:center;padding:20px}.course-modal-overlay.active{display:flex}.course-modal{width:min(780px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:19px;padding:30px;position:relative;box-shadow:0 25px 70px rgba(0,0,0,.25)}.close-modal{position:absolute;right:18px;top:18px;width:35px;height:35px;border:0;border-radius:50%;background:#f0f3f7;cursor:pointer;font-size:20px}.modal-icon{width:57px;height:57px;font-size:27px;margin-bottom:16px}.course-modal h2{margin:0;color:#13243c;font-size:29px}.modal-description{color:#69798d;line-height:1.7;font-size:14px;margin:12px 0 22px}.modal-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:25px}.modal-info-box{background:#f6f8fb;border:1px solid #e6ebf1;border-radius:10px;padding:12px}.modal-info-box strong{display:block;color:#243851;font-size:13px}.modal-info-box span{color:#7b8899;font-size:10px}.modal-section-title{color:#203550;font-weight:800;font-size:14px;margin:20px 0 12px}.modal-skills span{background:#edf5ff;color:#2a609e;padding:7px 9px;border-radius:7px;font-size:11px;font-weight:650}.lesson-list{border:1px solid #e4e9ef;border-radius:11px;overflow:hidden}.lesson-item{display:flex;gap:13px;padding:14px;border-bottom:1px solid #edf0f4}.lesson-item:last-child{border:0}.lesson-number{width:34px;height:34px;min-width:34px;border-radius:8px;background:#f1f5f9;color:#66778c;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}.lesson-item h4{margin:0 0 4px;color:#263a54;font-size:13px}.lesson-item p{margin:0;color:#78879a;font-size:12px;line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid #e9edf2}.modal-close-btn,.start-learning-btn{min-height:43px;padding:0 18px;border-radius:9px;font-weight:750;cursor:pointer}.modal-close-btn{border:1px solid #d5dfe9;background:#fff;color:#5b6b7e}.start-learning-btn{border:1px solid #1769d3;background:#1769d3;color:#fff}@media(max-width:1100px){.course-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.dashboard-main{padding:35px 20px 55px}.dash-head{flex-direction:column;align-items:flex-start}.learning-add-btn{width:100%}.learning-toolbar{grid-template-columns:1fr}.course-grid{grid-template-columns:1fr}.modal-info{grid-template-columns:1fr}}@media(max-width:500px){.dash-head h1{font-size:31px}.dash-head p{font-size:14px}.dashboard-main{padding-left:13px;padding-right:13px}.course-modal{padding:22px 17px}.course-modal h2{font-size:24px}.modal-actions{flex-direction:column-reverse}.modal-close-btn,.start-learning-btn{width:100%}}
</style></head>
<body class="learning-page">
<header class="site-header" data-site-header></header><div id="appShell"></div>
<main class="dashboard-main">
<div class="dash-head"><div><span class="section-kicker">LEARNING HUB</span><h1>Find your next learning opportunity.</h1><p>Explore role-relevant learning and let competency intelligence guide what comes next.</p></div><button class="btn primary learning-add-btn" onclick="location.href='materials.html'">＋ Add My Material</button></div>
<div class="learning-toolbar"><div class="search"><span>⌕</span><input id="search" type="text" placeholder="Search courses, topics or competencies..." oninput="renderCoursePage()"></div><select id="category" onchange="renderCoursePage()"><option>All categories</option><option>Data & Analytics</option><option>Digital Fluency</option><option>Governance</option><option>Leadership</option><option>Programming</option></select><button class="filter-btn" type="button" onclick="clearCourseFilters()">☷ Clear Filters</button></div>
<div class="courses-heading"><div><h2 id="courseHeading">Recommended learning</h2><p id="courseCount">Courses available for your learning journey</p></div></div><div id="allCourses" class="course-grid"></div></main>
<div id="courseModalOverlay" class="course-modal-overlay" onclick="closeCourseModal(event)"><div class="course-modal" onclick="event.stopPropagation()"><button class="close-modal" onclick="closeCourseModal()">×</button><div id="modalContent"></div></div></div>
<footer class="site-footer" data-site-footer></footer><script src="js/app.js"></script>
<script>
const learningCourses=[
{id:"statistics",title:"Statistical Data Literacy",category:"Data & Analytics",level:"Beginner",duration:"4 hours",lessons:8,icon:"📊",description:"Build a strong foundation in understanding, interpreting and communicating statistical data.",skills:["Statistical literacy","Data interpretation","Descriptive statistics","Evidence-based reasoning"],topics:[["Introduction to Statistical Data","Understand datasets, variables, observations and common statistical terminology."],["Measures of Central Tendency","Learn mean, median and mode and understand when each measure is useful."],["Measures of Dispersion","Understand range, variance and standard deviation."],["Reading Statistical Tables","Interpret rows, columns, percentages and statistical indicators."],["Data Interpretation","Turn statistical results into meaningful conclusions."],["Communicating Statistical Evidence","Present statistical findings clearly for professional audiences."]]},
{id:"sampling",title:"Survey Sampling & Estimation",category:"Data & Analytics",level:"Intermediate",duration:"6 hours",lessons:10,icon:"🔬",description:"Understand sampling methods, sample design, sampling error and estimation.",skills:["Survey methodology","Sampling","Estimation","Sampling error"],topics:[["Population and Sample","Understand target populations, survey populations and samples."],["Sampling Frames","Learn the purpose of sampling frames."],["Probability Sampling","Understand simple random, systematic and stratified sampling."],["Stratified Sampling","Learn how population strata can improve sample design."],["Sampling Error","Understand why sample estimates differ from population parameters."],["Estimation","Learn principles of estimating population characteristics."],["Non-response","Understand how non-response affects survey quality."]]},
{id:"visualization",title:"Data Visualization for Statistical Reporting",category:"Data & Analytics",level:"Beginner",duration:"3.5 hours",lessons:7,icon:"📈",description:"Create clear and meaningful charts for statistical analysis and reporting.",skills:["Data visualization","Chart selection","Statistical reporting","Data communication"],topics:[["Why Visualization Matters","Understand how visual representation helps identify patterns."],["Choosing the Right Chart","Match statistical questions with appropriate chart types."],["Bar Charts and Comparisons","Use bar charts to compare categories effectively."],["Line Charts and Trends","Use line charts to communicate changes over time."],["Understanding Distributions","Explore visual approaches for showing distributions."],["Avoiding Misleading Visuals","Identify common problems involving scales and context."]]},
{id:"python",title:"Python for Statistical Analysis",category:"Programming",level:"Intermediate",duration:"8 hours",lessons:12,icon:"🐍",description:"Use Python to clean, explore and analyse structured statistical datasets.",skills:["Python","Data analysis","Data cleaning","Pandas"],topics:[["Python Fundamentals","Understand variables, data types, conditions, loops and functions."],["Working with Structured Data","Learn how tabular datasets can be represented and manipulated."],["Data Cleaning","Identify missing values, duplicates and inconsistent data."],["Pandas Fundamentals","Use DataFrames and Series for practical data analysis."],["Exploratory Data Analysis","Explore distributions, relationships and patterns."],["Statistical Summaries","Generate useful summaries for understanding a dataset."]]},
{id:"quality",title:"Data Quality & Validation",category:"Data & Analytics",level:"Intermediate",duration:"5 hours",lessons:9,icon:"✓",description:"Learn systematic approaches to improving the quality and reliability of data.",skills:["Data quality","Data validation","Consistency checks","Data management"],topics:[["What is Data Quality?","Understand accuracy, completeness, consistency and timeliness."],["Validation Rules","Learn how validation rules can detect invalid records."],["Missing Data","Identify and assess missing observations."],["Consistency Checks","Use logical relationships to detect inconsistencies."],["Outlier Detection","Understand why unusual observations need investigation."],["Data Quality Reporting","Communicate identified data-quality issues."]]},
{id:"official-statistics",title:"Introduction to Official Statistics",category:"Governance",level:"Beginner",duration:"4.5 hours",lessons:8,icon:"🏛️",description:"Understand the role, production process and importance of official statistics.",skills:["Official statistics","Statistical production","Evidence-based policy","Data governance"],topics:[["What are Official Statistics?","Understand the purpose and role of official statistical information."],["Statistical Production","Explore major stages involved in producing statistical outputs."],["Data Sources","Understand surveys, administrative data and other sources."],["Quality and Trust","Learn why quality and transparency matter."],["Statistical Indicators","Understand how indicators are constructed and interpreted."],["Evidence-Based Decision Making","Connect statistics with public planning and decision-making."]]},
{id:"analytics",title:"Advanced Data Analytics",category:"Data & Analytics",level:"Advanced",duration:"10 hours",lessons:14,icon:"🧠",description:"Strengthen analytical thinking for complex datasets and evidence-based insights.",skills:["Advanced analytics","Analytical reasoning","Data interpretation","Pattern detection"],topics:[["Advanced Exploratory Analysis","Develop structured approaches to investigating complex datasets."],["Relationships Between Variables","Explore relationships and associations between variables."],["Trend Analysis","Identify and communicate meaningful trends."],["Analytical Quality Checks","Validate analytical conclusions against data and assumptions."],["Evidence-Based Insights","Translate analysis into defensible insights."]]},
{id:"digital",title:"Digital Fluency for Professionals",category:"Digital Fluency",level:"Beginner",duration:"5 hours",lessons:9,icon:"💻",description:"Develop practical digital skills needed for efficient modern professional work.",skills:["Digital literacy","Online collaboration","Digital tools","Information management"],topics:[["Digital Workplace","Understand modern digital workplace concepts."],["Information Management","Organize and manage digital information effectively."],["Online Collaboration","Use digital collaboration practices effectively."],["Digital Communication","Communicate professionally using digital channels."],["Digital Security Basics","Understand basic principles of safe digital work."]]},
{id:"leadership",title:"Leadership & Decision Making",category:"Leadership",level:"Intermediate",duration:"6 hours",lessons:10,icon:"🎯",description:"Strengthen leadership thinking, decision-making and professional communication.",skills:["Leadership","Decision making","Communication","Problem solving"],topics:[["Leadership Fundamentals","Understand core principles of effective leadership."],["Decision Making","Develop structured approaches to professional decisions."],["Problem Solving","Break complex problems into manageable parts."],["Team Communication","Communicate goals, feedback and expectations clearly."],["Strategic Thinking","Develop long-term and evidence-based thinking."]]}
];
function renderCoursePage(){const c=document.getElementById("allCourses"),s=(document.getElementById("search")?.value||"").trim().toLowerCase(),cat=document.getElementById("category")?.value||"All categories",h=document.getElementById("courseHeading"),n=document.getElementById("courseCount");if(!c)return;const filtered=learningCourses.filter(x=>{const text=[x.title,x.description,x.category,x.level,...x.skills,...x.topics.flat()].join(" ").toLowerCase();return(!s||text.includes(s))&&(cat==="All categories"||x.category===cat)});c.innerHTML="";h.textContent=s?`Search results for "${s}"`:"Recommended learning";n.textContent=`${filtered.length} ${filtered.length===1?"course":"courses"} available`;if(!filtered.length){c.innerHTML=`<div class="no-courses"><div class="no-courses-icon">🔍</div><h3>No matching courses found</h3><p>Try another course name, topic, competency or category.</p><button onclick="clearCourseFilters()">View all courses</button></div>`;return}filtered.forEach(course=>{const card=document.createElement("article");card.className="learn-course-card";card.innerHTML=`<div class="course-top"><div class="course-icon">${course.icon}</div><span class="course-level level-${course.level.toLowerCase()}">${course.level}</span></div><div class="course-body"><span class="course-category">${course.category}</span><h3>${course.title}</h3><p class="course-description">${course.description}</p><div class="course-meta"><span>⏱ ${course.duration}</span><span>📚 ${course.lessons} lessons</span></div><div class="course-skills">${course.skills.slice(0,3).map(x=>`<span>${x}</span>`).join("")}</div></div><div class="course-footer"><button class="course-btn" onclick="openCourse('${course.id}')">View Course →</button></div>`;c.appendChild(card)})}
function openCourse(id){const course=learningCourses.find(x=>x.id===id);if(!course)return;document.getElementById("modalContent").innerHTML=`<div class="modal-icon">${course.icon}</div><span class="course-category">${course.category}</span><h2>${course.title}</h2><p class="modal-description">${course.description}</p><div class="modal-info"><div class="modal-info-box"><strong>${course.duration}</strong><span>Duration</span></div><div class="modal-info-box"><strong>${course.lessons}</strong><span>Lessons</span></div><div class="modal-info-box"><strong>${course.level}</strong><span>Difficulty</span></div></div><div class="modal-section-title">Skills covered</div><div class="modal-skills">${course.skills.map(x=>`<span>✓ ${x}</span>`).join("")}</div><div class="modal-section-title">Course content</div><div class="lesson-list">${course.topics.map((x,i)=>`<div class="lesson-item"><div class="lesson-number">${String(i+1).padStart(2,"0")}</div><div><h4>${x[0]}</h4><p>${x[1]}</p></div></div>`).join("")}</div><div class="modal-actions"><button class="modal-close-btn" onclick="closeCourseModal()">Close</button><button class="start-learning-btn" onclick="startLearning('${course.id}')">▶ Start Learning</button></div>`;document.getElementById("courseModalOverlay").classList.add("active");document.body.style.overflow="hidden"}
function closeCourseModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById("courseModalOverlay").classList.remove("active");document.body.style.overflow=""}function clearCourseFilters(){document.getElementById("search").value="";document.getElementById("category").value="All categories";renderCoursePage()}function startLearning(id){localStorage.setItem("learnAI_selectedCourse",id);location.href="course-detail.html"}renderShell("courses");renderCoursePage();document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCourseModal()});
</script></body></html>
